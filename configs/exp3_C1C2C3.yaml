# configs/exp3_C1C2C3.yaml — Ablation Exp 3 (proposed method: C1 + C2 + C3)
ablation:
  use_C1_adaptive: true
  use_C2_ctrv: true
  use_C3_reliability: true

# C2 uncertainty gating: lost motorcycle tracks may re-associate inside
# the CTRV innovation ellipse (validated 2026-07-14: moto re-id events
# -52% vs baseline on NKKN 9000-frame replay, no ID-transfer inflation).
tracker:
  uncertainty_gating: true

# NSA measurement noise for CTRV (validated 2026-07-14: moto re-id
# 125 -> 108 on NKKN replay, flip rate DOWN 23.7% -> 22.0%).
ctrv:
  nsa_noise: true
